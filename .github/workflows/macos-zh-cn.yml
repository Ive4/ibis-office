name: macOS Chinese build

on:
  push:
    branches: [zh-cn]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      CARGO_BUILD_JOBS: '2'
      IBIS_FORK_NAME: Han Office
      IBIS_FORK_BUNDLE_ID: com.github.ive4.hanoffice
      IBIS_FORK_DOWNLOADS_URL: https://github.com/${{ github.repository }}/actions/workflows/macos-zh-cn.yml
      IBIS_TEST_I18N: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          persist-credentials: false
      - name: Set up Rust and Metal
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          if ! xcrun -sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
            xcrun -sdk macosx metal --version
          fi
      - name: Test localization, then build and verify app bundle
        run: |
          bash scripts/bundle-macos.sh --release
          app="target/release/$IBIS_FORK_NAME.app"
          lipo -verify_arch arm64 "$app/Contents/MacOS/ibisOffice"
          codesign --verify --deep --strict "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = "$IBIS_FORK_BUNDLE_ID"
          mkdir -p dist
          zip=Han-Office-macOS-arm64.zip
          ditto -c -k --sequesterRsrc --keepParent "$app" "dist/$zip"
          (cd dist && shasum -a 256 "$zip" > "$zip.sha256")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Han-Office-macOS-arm64
          path: dist/
          compression-level: 0
          if-no-files-found: error
