name: macOS Chinese build

on:
  push:
    branches: [zh-cn]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15-intel
    timeout-minutes: 120
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      CARGO_BUILD_JOBS: '3'
      CARGO_BUILD_TARGET: aarch64-apple-darwin
      IBIS_FORK_NAME: Han Office
      IBIS_FORK_BUNDLE_ID: com.github.ive4.hanoffice
      IBIS_FORK_DOWNLOADS_URL: https://github.com/${{ github.repository }}/actions/workflows/macos-zh-cn.yml
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          persist-credentials: false
      - name: Set up Rust and Metal
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "$CARGO_BUILD_TARGET"
          if ! xcrun -sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
            xcrun -sdk macosx metal --version
          fi
      - name: Test localization on the runner
        env:
          CARGO_PROFILE_TEST_DEBUG: '0'
        run: |
          test_target_dir="$RUNNER_TEMP/han-office-i18n"
          env -u CARGO_BUILD_TARGET CARGO_TARGET_DIR="$test_target_dir" \
            cargo test --locked -p ibis-office-base --lib i18n::tests
          rm -rf -- "$test_target_dir"
      - name: Build and verify ARM64 app bundle
        run: |
          bash scripts/bundle-macos.sh --release
          app="target/release/$IBIS_FORK_NAME.app"
          lipo "$app/Contents/MacOS/ibisOffice" -verify_arch arm64
          codesign --verify --deep --strict "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = "$IBIS_FORK_BUNDLE_ID"
          mkdir -p dist
          zip=Han-Office-macOS-arm64.zip
          ditto -c -k --sequesterRsrc --keepParent "$app" "dist/$zip"
          (cd dist && shasum -a 256 "$zip" > "$zip.sha256")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Han-Office-macOS-arm64
          path: dist/
          compression-level: 0
          if-no-files-found: error
